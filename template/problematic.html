<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Statement & Justification</title>
    <!-- Optional icons for professional dynamism -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <main class="main-container">
        
        <header class="page-header">
            <span class="badge">Project Context</span>
            <h1>Problem Statement & Justification</h1>
            <p class="subtitle"></p>
        </header>

        <section class="content-section row-reverse">
            <div class="text-block">
                <div class="section-title">
                    <i class="fa-solid fa-triangle-exclamation icon-problem"></i>
                    <h2>PROBLEMATIC</h2>
                </div>
                <div class="glass-card">
                    
                </div>
            </div>
            
            <div class="image-block">
                <div class="image-placeholder">
                    <i class="fa-regular fa-image"></i>
                    <span>Illustrative Problem Image</span>
                    <small>Suggested dimensions: 600x400px</small>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="text-block">
                <div class="section-title">
                    <i class="fa-solid fa-lightbulb icon-justification"></i>
                    <h2>Why We Chose This Problem</h2>
                </div>
                <div class="glass-card">
                    
                </div>
            </div>

            <div class="image-block">
                <div class="image-placeholder">
                    <i class="fa-regular fa-image"></i>
                    <span>Illustrative Justification Image</span>
                    <small>Suggested dimensions: 600x400px</small>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
